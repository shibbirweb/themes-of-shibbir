name: Publish Extension

# Publishes a release once it reaches main and CI has passed there.
#
# The last step of release.yml: merging its release pull request moves main to a
# new version. This runs whenever CI finishes on a push to main and acts only
# when CI passed and main is at a version with no tag yet; every other run ends
# with a note. It publishes to the VS Code Marketplace and Open VSX from the
# commit CI passed on, then creates the GitHub release and tag with the version's
# changelog section as notes and the .vsix attached.
#
# The GitHub release comes last on purpose: if a marketplace publish fails, no
# tag exists yet, so "Re-run failed jobs" retries the whole publish. Both
# publishes skip a version the marketplace already has, so a retry after a
# partial success is safe. Run it by hand from main (Actions, Publish Extension,
# Run workflow) to retry outside a CI run.
#
# Required repository secrets:
#   VSCE_PAT  Azure DevOps token with Marketplace > Manage scope.
#   OVSX_PAT  Open VSX token. Both Open VSX steps are skipped when it is unset.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the .vsix

# The same version must not be published twice by two CI runs finishing close together.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Is there a release to publish?
    runs-on: ubuntu-latest
    # Only CI that passed on a push to main, or a manual run on main. A pull
    # request's CI never publishes anything.
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare the version with the tags
        id: check
        run: |
          version="$(node scripts/version.mjs show)"
          if git rev-parse --verify --quiet "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "main is at $version with no tag yet: publishing v$version." >> "$GITHUB_STEP_SUMMARY"
          {
            echo "tag=v$version"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ needs.check.outputs.tag }}
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
      SHA: ${{ needs.check.outputs.sha }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm turns --frozen-lockfile on by default whenever CI is set, so a bare
      # "pnpm install" here would abort with ERR_PNPM_NO_LOCKFILE while no
      # pnpm-lock.yaml is committed. Once one is, drop this flag and add
      # "cache: pnpm" to setup-node above.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # CI already ran these on this commit; they are cheap, and a manual run has
      # no CI result behind it.
      - name: Validate themes and version
        run: |
          node scripts/validate-themes.mjs
          node scripts/version.mjs check

      - name: Package VSIX
        run: pnpm exec vsce package --no-dependencies -o "themes-of-shibbir-${TAG}.vsix"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Repository secret VSCE_PAT is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          pnpm exec vsce publish --no-dependencies --skip-duplicate --packagePath "themes-of-shibbir-${TAG}.vsix"

      - name: Ensure Open VSX namespace
        if: ${{ env.OVSX_PAT != '' }}
        # First publish for a publisher requires the namespace to exist; ignore
        # the error on later runs when it already does.
        run: pnpm exec ovsx create-namespace shibbirweb -p "$OVSX_PAT" || true

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: pnpm exec ovsx publish "themes-of-shibbir-${TAG}.vsix" --skip-duplicate -p "$OVSX_PAT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/version.mjs notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "themes-of-shibbir-${TAG}.vsix" --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" --latest --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "### Published $TAG"
            echo ''
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
