; INI sample: sections, comments in both styles, quoted and bare values.
# Both semicolon and hash comments are common in the wild.

[theme]
name = Themes of Shibbir
version = 1.0.0
ui_theme = vs-dark
published = false
rating = 4.75

[colors]
editor.background = #263238
editor.foreground = #eeffff
activityBarBadge.background = #007acc
sideBarTitle.foreground = #bbbbbb

[paths]
theme_file = "themes/Themes of Shibbir-color-theme.json"
samples = ./sample-files
output = ${HOME}/dist

[build]
targets = vs-dark, vs
timeout = 120
retries = 3
verbose = yes
strip_comments = no

[php]
; Mirrors the shape of a php.ini block.
memory_limit = 512M
max_execution_time = 60
display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone = Asia/Dhaka
