# nginx sample: directives, blocks, variables, regex locations.

user  www-data;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size  20m;
    gzip  on;
    gzip_types  text/plain text/css application/json application/javascript;

    upstream api_backend {
        least_conn;
        server 127.0.0.1:3000 weight=3 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:3001 backup;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        listen       [::]:80;
        server_name  themes.example.com www.themes.example.com;

        return 301 https://$host$request_uri;
    }

    server {
        listen       443 ssl http2;
        server_name  themes.example.com;
        root         /var/www/themes/public;
        index        index.php index.html;

        ssl_certificate      /etc/ssl/certs/themes.crt;
        ssl_certificate_key  /etc/ssl/private/themes.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass   unix:/run/php/php8.2-fpm.sock;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }

        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2)$ {
            expires     30d;
            add_header  Cache-Control "public, immutable";
            access_log  off;
        }

        location /api/ {
            proxy_pass          http://api_backend;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection $connection_upgrade;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_read_timeout  60s;
        }

        location = /health {
            access_log off;
            return 200 'ok';
        }

        error_page  404              /404.html;
        error_page  500 502 503 504  /50x.html;
    }
}
